[project]
name = "saas-rh"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Benjamin Lemin", email = "benjamin.lemin@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.143.0",
    "openai>=1.0.0",
    "python-multipart>=0.0.32",
    "python-dotenv>=1.0.0",
    "uvicorn[standard]>=0.54.0",
    "anthropic>=1.13.0",
    "pypdf>=6.20.1",
    "chromadb>=1.5.9",
]

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
]
